name: Release

# Every push to main: check the code, build installers for Windows, macOS and Linux, and publish them
# as a new GitHub Release. Installed apps look at the latest release to update themselves.
#
# Versions are numbered automatically: the major.minor from package.json plus the workflow run number
# (e.g. 0.1.57), so every release is newer than the one before. Change major.minor in package.json
# for bigger releases. The version is stamped into the build; nothing is committed back.
#
# Run it by hand from the Actions tab with "Run workflow".
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

env:
  # How many releases to keep (older ones are deleted after publishing, installers are large).
  KEEP_RELEASES: 5
  # Lumi runs speech recognition on the CPU: skip onnxruntime's optional GPU (CUDA) downloads. They are
  # hundreds of MB, made `npm ci` time out, and bloated the Linux installers.
  ONNXRUNTIME_NODE_INSTALL: skip

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - id: version
        run: |
          BASE=$(node -p "require('./package.json').version.split('.').slice(0, 2).join('.')")
          echo "version=$BASE.${{ github.run_number }}" >> "$GITHUB_OUTPUT"
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  build:
    needs: check
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows
            builder: --win
          - os: macos-latest
            name: macos
            builder: --mac --x64 --arm64
          - os: ubuntu-latest
            name: linux
            builder: --linux
    runs-on: ${{ matrix.os }}
    env:
      GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
      GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Stamp the version
        shell: bash
        run: npm pkg set version="${{ needs.check.outputs.version }}"

      - name: Require the Google OAuth secrets
        shell: bash
        run: |
          if [ -z "$GOOGLE_CLIENT_ID" ] || [ -z "$GOOGLE_CLIENT_SECRET" ]; then
            echo "::error::Add the repository secrets GOOGLE_CLIENT_ID and GOOGLE_CLIENT_SECRET (Settings > Secrets and variables > Actions). The installers need them to sign in to Google."
            exit 1
          fi

      - name: Build app and create google-oauth.json
        run: |
          npm run build
          npm run oauth:json

      - name: Package installers
        run: npx electron-builder ${{ matrix.builder }} --publish never
        env:
          # No signing certificates: skip Apple/Windows identity discovery.
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: List installers
        shell: bash
        run: ls -la release

      - uses: actions/upload-artifact@v4
        with:
          name: lumi-${{ matrix.name }}
          if-no-files-found: error
          retention-days: 30
          # The installers, plus the files installed apps read to update themselves (latest*.yml and block maps).
          path: |
            release/*.exe
            release/*.dmg
            release/*.AppImage
            release/*.deb
            release/*.blockmap
            release/latest*.yml

  release:
    needs: [check, build]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist-release
          merge-multiple: true

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          ls -la dist-release
          # The update feed must be there, or installed apps would never see this release.
          test -f dist-release/latest.yml || { echo "::error::latest.yml (Windows update feed) is missing"; exit 1; }
          gh release create "v$VERSION" dist-release/* \
            --target "$GITHUB_SHA" \
            --title "Lumi $VERSION" \
            --latest \
            --generate-notes \
            --notes "Installed copies of Lumi update themselves (Windows and Linux AppImage); on macOS and the .deb, Lumi tells you a new version is out. Builds are unsigned: Windows shows a SmartScreen warning (More info > Run anyway) and macOS needs right-click > Open. Lumi also needs Ollama installed locally."

      - name: Delete old releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release list --limit 100 --json tagName --jq ".[${KEEP_RELEASES}:][].tagName" | while read -r tag; do
            echo "Deleting old release $tag"
            gh release delete "$tag" --cleanup-tag --yes
          done
