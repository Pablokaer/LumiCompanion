name: CI

# Type-checks, tests and builds the app on every pull request and on every branch except main
# (main is handled by release.yml, which runs the same checks before packaging).
on:
  pull_request:
  push:
    branches-ignore: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Skip onnxruntime's optional GPU (CUDA) downloads: unused (speech runs on the CPU) and slow.
  ONNXRUNTIME_NODE_INSTALL: skip

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
