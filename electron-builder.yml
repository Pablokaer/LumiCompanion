appId: com.finperiti.lumi
productName: Lumi
# e.g. Lumi-0.1.0-win-x64.exe, Lumi-0.1.0-mac-arm64.dmg, Lumi-0.1.0-linux-x86_64.AppImage
artifactName: ${productName}-${version}-${os}-${arch}.${ext}
# Where installed apps look for updates, and what the latest*.yml files point to.
publish:
  provider: github
  owner: Pablokaer
  repo: LumiCompanion
  releaseType: release
directories:
  output: release
  buildResources: build
files:
  - dist/**
  - dist-electron/**
  - assets/**
  - package.json
  - "!**/*.map"
  - "!release/**"
  # Speech-to-text is transformers.js + onnxruntime-node (Node build); the browser runtime and other CPUs are not needed.
  - "!node_modules/onnxruntime-web/**"
  - "!node_modules/@img/sharp-wasm32/**"
# Native binaries and their shared libraries must live outside the asar archive.
asarUnpack:
  - node_modules/onnxruntime-node/**
  - node_modules/sharp/**
  - node_modules/@img/**
  - node_modules/koffi/**
extraResources:
  # Your Google OAuth "Desktop app" client JSON (git-ignored). Run `npm run oauth:json` to create it from .env.
  - from: google-oauth.json
    to: google-oauth.json
    filter: ["**/*"]
win:
  target:
    - target: nsis
      arch: [x64]
  icon: build/icon.png
  files:
    - "!node_modules/onnxruntime-node/bin/napi-v6/darwin/**"
    - "!node_modules/onnxruntime-node/bin/napi-v6/linux/**"
    - "!node_modules/onnxruntime-node/bin/napi-v6/win32/arm64/**"
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
mac:
  # The .zip is what installed copies download to update themselves (the .dmg is for the first install).
  target: [dmg, zip]
  icon: build/icon.png
  category: public.app-category.productivity
  # Ad-hoc signature: Apple Silicon refuses to run completely unsigned apps. Not a developer ID, so Gatekeeper still warns.
  identity: "-"
  hardenedRuntime: false
  gatekeeperAssess: false
  extendInfo:
    LSUIElement: true
    NSMicrophoneUsageDescription: Lumi uses the microphone for voice input in the chat.
  files:
    - "!node_modules/onnxruntime-node/bin/napi-v6/win32/**"
    - "!node_modules/onnxruntime-node/bin/napi-v6/linux/**"
linux:
  target:
    - target: AppImage
      arch: [x64]
    - target: deb
      arch: [x64]
  icon: build/icon.png
  category: Utility
  maintainer: Finperiti <pablo@finperiti.com>
  files:
    - "!node_modules/onnxruntime-node/bin/napi-v6/darwin/**"
    - "!node_modules/onnxruntime-node/bin/napi-v6/win32/**"
    - "!node_modules/onnxruntime-node/bin/napi-v6/linux/arm64/**"
