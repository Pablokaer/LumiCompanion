appId: com.finperiti.lumi
productName: Lumi
directories:
  output: release
  buildResources: build
files:
  - dist/**
  - dist-electron/**
  - assets/**
  - package.json
extraResources:
  # Optional: drop your Google OAuth "Desktop app" client JSON here before packaging.
  - from: google-oauth.json
    to: google-oauth.json
    filter: ["**/*"]
win:
  target: nsis
  icon: build/icon.png
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
mac:
  target: dmg
  icon: build/icon.png
  category: public.app-category.productivity
  extendInfo:
    LSUIElement: true
